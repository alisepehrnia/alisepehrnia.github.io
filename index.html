<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO -->
    <meta name="keywords" content="{{KEYWORDS}}" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{URL}}" />

    <!-- Manifest / PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="{{APP_TITLE}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/touch-icon-167.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#2d89ef" />
    <meta name="msapplication-square70x70logo" content="/mstile-70x70.png" />
    <meta name="msapplication-square150x150logo" content="/mstile-150x150.png" />
    <meta name="msapplication-wide310x150logo" content="/mstile-310x150.png" />
    <meta name="msapplication-square310x310logo" content="/mstile-310x310.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Theme -->
    <meta name="msapplication-TileColor" content="#2d89ef" />
    <meta name="theme-color" content="#ededed" />

    <!-- Vazir Font -->
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
      type="text/css"
    />

    {{ANALYTICS}}
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
